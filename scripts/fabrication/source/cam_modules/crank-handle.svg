<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="64mm" height="28mm"
     viewBox="0 0 64 28"
     data-profile-key="motionsmith-ms4n" data-grid-pitch-mm="20" data-hole-diameter-mm="4">
  <title>Automataii fabrication cam module crank-handle</title>
  <desc>Crank handle for the pegboard-mounted gravity cam follower module. The 15x15 pegboard remains the structural base.</desc>
  <defs>
    <style>
      .cut { fill: none; stroke: #ed1c24; stroke-width: 0.25; stroke-miterlimit: 10; }
      .drill { fill: none; stroke: #0071bc; stroke-width: 0.2; stroke-miterlimit: 10; }
      .score { fill: none; stroke: #777777; stroke-width: 0.15; stroke-dasharray: 2 1; }
      .label { fill: #333333; font-family: Arial, Helvetica, sans-serif; font-size: 4px; }
      .engrave { fill: #008000; font-family: Arial, Helvetica, sans-serif; font-size: 3.2px; font-weight: bold; }
      .tiny { fill: #333333; font-family: Arial, Helvetica, sans-serif; font-size: 3px; }
      .small { fill: #333333; font-family: Arial, Helvetica, sans-serif; font-size: 3.6px; }
      .step-title { fill: #111827; font-family: Arial, Helvetica, sans-serif; font-size: 5px; font-weight: bold; }
      .part-card-label { fill: #111827; font-family: Arial, Helvetica, sans-serif; font-size: 3.5px; font-weight: bold; }
      .coord-label { fill: #111827; font-family: Arial, Helvetica, sans-serif; font-size: 6px; font-weight: bold; }
      .paper { fill: #ffffff; stroke: none; }
    </style>
  </defs>
  <path d="M 12 7 L 52 7 A 7 7 0 0 1 52 21 L 12 21 A 7 7 0 0 1 12 7 Z" class="cut cam-module-outline"/>
  <circle cx="14" cy="14" r="2" class="drill cam-module-hole axle-hole linkage-hole" data-hole-role="axle" data-hole-diameter-mm="4" data-hole-index="0"/>
  <circle cx="50" cy="14" r="2" class="drill cam-module-hole axle-hole linkage-hole" data-hole-role="hand-grip" data-hole-diameter-mm="4" data-hole-index="1"/>
  <text x="32" y="22" class="engrave" text-anchor="middle" dominant-baseline="middle" data-engrave-role="part-label" data-engrave-label="Crank Handle" style="font-size:3px">Crank Handle</text>
</svg>
