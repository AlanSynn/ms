name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check ONNX LFS asset
        run: |
          git lfs pull --include="public/onnx/pose_model.onnx"
          BYTES="$(wc -c < public/onnx/pose_model.onnx | tr -d ' ')"
          test "$BYTES" -gt 1000000
          if head -c 64 public/onnx/pose_model.onnx | grep -q "version https://git-lfs"; then
            echo "public/onnx/pose_model.onnx is a Git LFS pointer, not model bytes" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tag
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Build
        env:
          VITE_BASE_PATH: /ms/
        run: bun run build

      - name: Check built ONNX asset
        run: |
          BYTES="$(wc -c < dist/onnx/pose_model.onnx | tr -d ' ')"
          test "$BYTES" -gt 1000000
          if head -c 64 dist/onnx/pose_model.onnx | grep -q "version https://git-lfs"; then
            echo "dist/onnx/pose_model.onnx is a Git LFS pointer, not model bytes" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
