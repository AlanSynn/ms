name: Deploy classroom web

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: "classroom-release-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Check release tag
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Run all unit and contract tests
        run: bun run test:all

      - name: Build browser diagnostics profile
        run: bun run build:e2e

      - name: Run focused production-preview browser checks
        env:
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_WORKERS: 3
        run: >-
          env -u NO_COLOR bunx playwright test
          tests/browser/webgl-recovery.spec.ts
          tests/browser/workflow.spec.ts
          --grep
          'WebGL unavailable|Foundry restores the same scene|Foundry defers Rapier|Getting Started guided project|Load package review|Legacy storage namespace|Trace lazily streams|School build has no image-recognition'

      - name: Run isolated interaction checks
        env:
          PLAYWRIGHT_SERVER: preview
          PLAYWRIGHT_WORKERS: 1
        run: >-
          env -u NO_COLOR bunx playwright test
          tests/browser/workflow.spec.ts
          --grep
          'Recommendation worker and job stay unloaded|Design Fit runs'

      - name: Build GitHub Pages artifact
        env:
          VITE_BASE_PATH: /ms/
        run: bun run build

      - name: Check GitHub Pages bundle budget
        run: bun run test:bundle-budget

      - name: Check GitHub Pages classroom exclusions
        run: bun run test:no-image-recognition

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Build Cloudflare root artifact
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Check Cloudflare bundle budget
        run: bun run test:bundle-budget

      - name: Check Cloudflare classroom exclusions
        run: bun run test:no-image-recognition

      - name: Upload Cloudflare artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static
          path: ./dist
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    environment:
      name: cloudflare-production
      url: https://motionsmith.org/
    runs-on: ubuntu-latest
    needs: [build, deploy-pages]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Cloudflare artifact
        uses: actions/download-artifact@v5
        with:
          name: cloudflare-static
          path: ./dist

      - name: Deploy to motionsmith.org
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.112.0
          packageManager: npm
          command: deploy --config wrangler.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun for live verification
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install live verification browser
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Verify motionsmith.org classroom deployment
        env:
          CLOUDFLARE_CLASSROOM_URL: https://motionsmith.org/
        run: bun run test:cloudflare-live
