name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check ONNX LFS asset
        run: |
          git lfs pull --include="public/onnx/pose_model.int8.ort" --exclude=""
          BYTES="$(wc -c < public/onnx/pose_model.int8.ort | tr -d ' ')"
          test "$BYTES" -gt 1000000
          test "$BYTES" -lt 40000000
          if head -c 64 public/onnx/pose_model.int8.ort | grep -q "version https://git-lfs"; then
            echo "public/onnx/pose_model.int8.ort is a Git LFS pointer, not model bytes" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release tag
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Test contracts
        run: bun run test

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Test study telemetry
        run: bun run test:study:browser

      - name: Build
        env:
          VITE_BASE_PATH: /ms/
          VITE_STUDY_PROFILE: ${{ vars.STUDY_PROFILE || 'study' }}
          VITE_STUDY_ENDPOINT: /ms-study/v1
          VITE_STUDY_DEPLOYMENT: ${{ github.ref_name }}
          VITE_STUDY_BUILD_SHA: ${{ github.sha }}
          VITE_STUDY_CLASS_ID: ${{ vars.STUDY_CLASS_ID || 'class' }}
          VITE_STUDY_SESSION_ID: ${{ vars.STUDY_SESSION_ID || 'session' }}
          VITE_STUDY_TEAM_ID: ${{ vars.STUDY_TEAM_ID || 'none' }}
        run: bun run build

      - name: Check built ONNX asset
        run: |
          BYTES="$(wc -c < dist/onnx/pose_model.int8.ort | tr -d ' ')"
          test "$BYTES" -gt 1000000
          test "$BYTES" -lt 40000000
          if head -c 64 dist/onnx/pose_model.int8.ort | grep -q "version https://git-lfs"; then
            echo "dist/onnx/pose_model.int8.ort is a Git LFS pointer, not model bytes" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  study-worker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy study collector
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          workingDirectory: infrastructure/study
          command: deploy
          secrets: |
            GITHUB_TOKEN
            ADMIN_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.STUDY_GITHUB_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.STUDY_ADMIN_TOKEN }}

      - name: Check study collector
        run: >-
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsS -o /dev/null
          -X OPTIONS -H 'Origin: https://alansynn.com'
          https://alansynn.com/ms-study/v1/batch

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, study-worker]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
