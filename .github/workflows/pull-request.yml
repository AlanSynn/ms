name: Pull request

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ matrix.first }}+${{ matrix.second }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - first: 1
            second: 5
            contracts: true
          - first: 2
            second: 6
            contracts: false
          - first: 3
            second: 7
            contracts: false
          - first: 4
            second: 8
            contracts: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Check ONNX asset
        run: |
          git lfs pull --include="public/onnx/pose_model.onnx"
          BYTES="$(wc -c < public/onnx/pose_model.onnx | tr -d ' ')"
          test "$BYTES" -gt 1000000
          if head -c 64 public/onnx/pose_model.onnx | grep -q "version https://git-lfs"; then
            echo "public/onnx/pose_model.onnx is a Git LFS pointer, not model bytes" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test contracts
        if: matrix.contracts
        run: bun run test

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build production preview
        run: bun run build

      - name: Test production preview ${{ matrix.first }}/8
        run: env -u NO_COLOR PLAYWRIGHT_SERVER=preview bunx playwright test --shard=${{ matrix.first }}/8 --workers=2

      - name: Test production preview ${{ matrix.second }}/8
        run: env -u NO_COLOR PLAYWRIGHT_SERVER=preview bunx playwright test --shard=${{ matrix.second }}/8 --workers=2

      - name: Test low-end image AI
        if: matrix.contracts
        run: bun run test:image-ai:performance

      - name: Test study profile
        if: matrix.contracts
        env:
          PLAYWRIGHT_WORKERS: 2
        run: bun run test:study:browser
