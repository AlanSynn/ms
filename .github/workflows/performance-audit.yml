name: Chromebook performance audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Audit scope
        required: true
        default: feature
        type: choice
        options:
          - feature
          - full
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: "chromebook-audit-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install branded Chrome
        run: bunx playwright install --with-deps chrome

      - name: Run short feature and playback gates
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'feature'
        run: bun run test:chromebook-audit

      - name: Run full ten-minute audit
        if: github.event_name == 'schedule' || inputs.scope == 'full'
        run: bun run test:chromebook-audit:full

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "chromebook-audit-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            artifacts/chromebook-audit
            test-results
          if-no-files-found: warn
