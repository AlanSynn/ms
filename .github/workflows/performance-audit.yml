name: Chromebook performance audit

on:
  pull_request:
    paths:
      - "App.tsx"
      - "components/**"
      - "hooks/**"
      - "runtime/**"
      - "utils/**"
      - "workers/**"
      - "tests/browser/chromebook*"
      - "tests/browser/classroom-entry-performance.spec.ts"
      - "tests/chromebook-audit-contract.test.ts"
      - "playwright.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/performance-audit.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: Emulation profile
        required: true
        default: acceptance-6x
        type: choice
        options:
          - regression-4x
          - acceptance-6x
      scope:
        description: Audit scope
        required: true
        default: feature
        type: choice
        options:
          - feature
          - full
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: "chromebook-audit-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_PROFILE: ${{ github.event_name == 'pull_request' && 'regression-4x' || (github.event_name == 'schedule' && 'acceptance-6x' || inputs.profile) }}
      AUDIT_SCOPE: ${{ github.event_name == 'schedule' && 'full' || (github.event_name == 'pull_request' && 'feature' || inputs.scope) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install branded Chrome
        run: bunx playwright install --with-deps chrome

      - name: Prepare isolated audit evidence directory
        run: |
          output_root="${RUNNER_TEMP}/chromebook-audit/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${AUDIT_PROFILE}-${AUDIT_SCOPE}"
          if [[ "${AUDIT_SCOPE}" == "full" ]]; then
            if [[ "${AUDIT_PROFILE}" != "acceptance-6x" ]]; then
              echo "The full ten-minute audit is an acceptance-6x gate." >&2
              exit 1
            fi
            audit_command="bun run test:chromebook-audit:full"
          else
            audit_command="bun run test:chromebook-audit"
          fi
          {
            echo "CHROMEBOOK_ARTIFACT_ROOT=${output_root}"
            echo "CHROMEBOOK_AUDIT_PROFILE=${AUDIT_PROFILE}"
            echo "CHROMEBOOK_AUDIT_SCOPE=${AUDIT_SCOPE}"
            echo "CHROMEBOOK_AUDIT_INVOCATION=CHROMEBOOK_AUDIT_PROFILE=${AUDIT_PROFILE} ${audit_command}"
            echo "CHROMEBOOK_ENTRY_AUDIT_OUTPUT=${output_root}/entry"
            echo "CHROMEBOOK_FEATURE_AUDIT_OUTPUT=${output_root}/features"
            echo "CHROMEBOOK_PLAYBACK_AUDIT_OUTPUT=${output_root}/playback"
            echo "CHROMEBOOK_SIMULATION_AUDIT_OUTPUT=${output_root}/playback"
            echo "CHROMEBOOK_STAGE_AUDIT_OUTPUT=${output_root}/stages/chromebook-stage-switch-audit.json"
            echo "CHROMEBOOK_HIGH_RESOLUTION_AUDIT_OUTPUT=${output_root}/high-resolution/chromebook-high-resolution-audit.json"
            echo "CHROMEBOOK_AUDIT_OUTPUT=${output_root}/workflow/chromebook-audit.json"
          } >> "${GITHUB_ENV}"
          bun tests/browser/chromebookAuditArtifacts.ts prepare "${output_root}" "${AUDIT_SCOPE}" "${AUDIT_PROFILE}"

      - name: Run 4x regression or 6x short acceptance gates
        if: env.AUDIT_SCOPE == 'feature'
        run: bun run test:chromebook-audit

      - name: Run 6x full ten-minute acceptance audit
        if: env.AUDIT_SCOPE == 'full'
        run: bun run test:chromebook-audit:full

      - name: Validate exact run evidence manifest
        if: always() && env.CHROMEBOOK_ARTIFACT_ROOT != ''
        run: bun tests/browser/chromebookAuditArtifacts.ts validate "${CHROMEBOOK_ARTIFACT_ROOT}" "${AUDIT_SCOPE}" "${AUDIT_PROFILE}"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "chromebook-audit-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            ${{ env.CHROMEBOOK_ARTIFACT_ROOT }}
            test-results
          if-no-files-found: warn
