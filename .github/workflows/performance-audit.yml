name: Chromebook performance audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Audit scope
        required: true
        default: feature
        type: choice
        options:
          - feature
          - full
          - real-ai
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: "chromebook-audit-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify ONNX model bytes
        run: |
          git lfs pull --include="public/onnx/pose_model.onnx"
          BYTES="$(wc -c < public/onnx/pose_model.onnx | tr -d ' ')"
          test "$BYTES" -gt 1000000
          if head -c 64 public/onnx/pose_model.onnx | grep -q "version https://git-lfs"; then
            echo "public/onnx/pose_model.onnx is a Git LFS pointer" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install branded Chrome
        run: bunx playwright install --with-deps chrome

      - name: Run short feature and playback gates
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'feature'
        run: bun run test:chromebook-audit

      - name: Run full ten-minute audit
        if: github.event_name == 'schedule' || inputs.scope == 'full'
        run: bun run test:chromebook-audit:full

      - name: Run explicit real-model AI audit
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'real-ai'
        run: bun run test:chromebook-audit:real-ai

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "chromebook-audit-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            artifacts/chromebook-audit
            test-results
          if-no-files-found: warn
